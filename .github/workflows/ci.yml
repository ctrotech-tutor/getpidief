name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint

  tests:
    name: Tests and isolated PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: getpidief_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply migrations to disposable service
        run: npm run db:mig
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/getpidief_test
      - name: Unit and mocked tests
        run: npm test -- --run
      - name: PostgreSQL connection and rollback
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/getpidief_test
      - name: Full application build (isolated configuration)
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/getpidief_test
          AUTH_SECRET: ci-build-only-not-a-production-secret-0123456789
          NEXTAUTH_SECRET: ci-build-only-not-a-production-secret-0123456789
          NEXT_TELEMETRY_DISABLED: '1'
      - name: PostgreSQL credential registration
        run: npm test -- --run tests/integration/postgres-auth-registration.test.ts
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/getpidief_test
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/getpidief_test
          TEST_DATABASE_WRITE: 'yes'
      - name: PostgreSQL social concurrency
        run: npm run test:db:social
        env:
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/getpidief_test
          TEST_DATABASE_WRITE: 'yes'

  preview:
    name: Standalone preview build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:preview
