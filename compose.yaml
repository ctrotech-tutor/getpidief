# Local development only. The published port is accessible from this machine only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: getpidief
      POSTGRES_USER: getpidief
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - getpidief-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getpidief -d getpidief"]
      interval: 5s
      timeout: 5s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  getpidief-postgres:
